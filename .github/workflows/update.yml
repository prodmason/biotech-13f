# Pulls new 13F filings from SEC EDGAR and publishes the site to GitHub Pages.
# Runs daily, on every push to main, and on demand (Actions tab -> "Update data and deploy" -> Run workflow).
name: Update data and deploy

on:
  schedule:
    - cron: "0 13 * * *"  # 13:00 UTC daily
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The SQLite database carries over between runs so fetches stay incremental.
      # If the cache is ever evicted, fetch.py rebuilds it from scratch (~20 min).
      - name: Restore database
        uses: actions/cache/restore@v6
        with:
          path: data/13f.db
          key: db-${{ github.run_id }}
          restore-keys: db-

      - name: Fetch filings and export site data
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
        run: python fetch.py

      - name: Save database
        uses: actions/cache/save@v6
        with:
          path: data/13f.db
          key: db-${{ github.run_id }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
